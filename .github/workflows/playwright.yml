name: PulsAI 3D Playwright QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright.yml'
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PULSAI_TEST_URL: ${{ secrets.PULSAI_TEST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulsai-3d-playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14